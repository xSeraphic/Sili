<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2a33"/>
      <stop offset="1" stop-color="#121116"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ff5a36" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chili" x1="0.2" y1="0.1" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="0.55" stop-color="#e3202b"/>
      <stop offset="1" stop-color="#a30f1f"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ed957"/>
      <stop offset="1" stop-color="#2f8f3a"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <!-- speed lines -->
  <g stroke="#ffc23d" stroke-width="26" stroke-linecap="round" opacity="0.9">
    <line x1="300" y1="470" x2="420" y2="470"/>
    <line x1="250" y1="548" x2="400" y2="548"/>
    <line x1="250" y1="626" x2="350" y2="626"/>
  </g>

  <!-- chilli body: slim, curved siling labuyo -->
  <path d="M676 318
           C628 470 540 640 330 790
           C318 799 312 812 326 812
           C540 742 690 590 784 404
           C798 368 770 324 728 314
           C710 310 690 311 676 318Z"
        fill="url(#chili)"/>
  <!-- highlight -->
  <path d="M690 380 C650 500 580 610 470 700" stroke="#ffffff" stroke-opacity="0.32"
        stroke-width="26" fill="none" stroke-linecap="round"/>

  <!-- calyx and stem -->
  <path d="M660 330 C680 284 760 276 800 312 C780 346 730 362 676 352Z" fill="url(#stem)"/>
  <path d="M740 300 C744 244 784 204 840 196" stroke="url(#stem)" stroke-width="34"
        fill="none" stroke-linecap="round"/>
</svg>
